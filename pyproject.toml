[project]
name = "ab-testing-python-example"
version = "0.1.0"
description = "Typed A/B test calculation example from XNova"
requires-python = ">=3.12,<3.13"
dependencies = []

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C90", "ARG", "PTH", "T20"]

[tool.ruff.lint.per-file-ignores]
"ab_test_calculation.py" = ["T201"]
